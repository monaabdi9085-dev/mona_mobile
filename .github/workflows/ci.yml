name: CI

on:
  push:
  workflow_dispatch:
    inputs:
      datafil:
        description: "CSV-fil som ska valideras"
        required: true
        default: "data/kundbas.csv"
        type: string

jobs:
  # Jobb 1: Datavalidering med Pandera
  datakontroll:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "pyproject.toml" 

      - name: Installera beroenden
        run: python -m pip install -e ".[dev]"

      - name: Validera kunddata
        env:
          DATAFIL: ${{ inputs.datafil || 'data/kundbas.csv' }} # <------ LLM ASSITANC 
        run: python kontroll_mapp/schema.py "$DATAFIL"    # <------ LLM ASSITANC 

  # Jobb 2: Tester och modellträning och evaluering !
  allt:
    needs: datakontroll
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Installera beroenden
        run: python -m pip install -e ".[dev]"

      - name: Kör tester
        run: python -m pytest

      - name: Träna modellen
        run: python -m churn.model
      

      - name: Evaluering
        run: python -m churn.evaluate


