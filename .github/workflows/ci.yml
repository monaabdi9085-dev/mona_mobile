name: CI
on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "data/**"
      - "kontroll_mapp/**"
      - "pyproject.toml"
      - ".github/workflows/**"

  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "data/**"
      - "kontroll_mapp/**"
      - "pyproject.toml"
      - ".github/workflows/**"

  workflow_dispatch:
    inputs:
      datafil:
        description: "CSV-fil som ska valideras"
        required: true
        default: "data/kundbas.csv"
        type: string

jobs:
  # Jobb 1: Datavalidering med Pandera
  datakontroll:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Installera beroenden
        run: python -m pip install -e ".[dev]"

      - name: Validera kunddata
        env:
          DATAFIL: ${{ inputs.datafil || 'data/kundbas.csv' }} # <------ LLM ASSITANC
        run: python kontroll_mapp/schema.py "$DATAFIL" # <------ LLM ASSITANC

  # Jobb 2: Tester på tre python versioner
  tester:
    needs: datakontroll
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Installera beroenden
        run: python -m pip install -e ".[dev]"

      - name: Kör tester
        run: python -m pytest

  training:
    needs: tester
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installera beroenden
        run: python -m pip install -e ".[dev]"

      - name: Träna modellen
        run: python -m churn.model

      - name: Ladda upp modellartefakt
        uses: actions/upload-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/

  utvardera:
    needs: training
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Ladda ner modellartefakt
        uses: actions/download-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installera beroenden
        run: python -m pip install -e ".[dev]"

      - name: Kontrollera tröskeln
        run: python -m churn.evaluate

      - name: Visa mätvärden i Summary
        run: |
          echo "## Modellens mätvärden" >> "$GITHUB_STEP_SUMMARY"
          cat outputs/matvarden.json >> "$GITHUB_STEP_SUMMARY"
   ringlista:
    needs: utvardera
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installera beroenden
        run: python -m pip install -e ".[dev]"

      - name: Ladda ner godkänd modell
        uses: actions/download-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/

      - name: Skapa ringlista
        run: python -m churn.score

      - name: Ladda upp ringlista
        uses: actions/upload-artifact@v4
        with:
          name: ringlista-${{ github.sha }}
          path: outputs/ringlista.csv
    